services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  proposal-bot:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: .env
    command: python -m proposal_bot.main
    volumes:
      - bot_data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  chat-bot:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: .env
    command: python -m chat_bot.main
    volumes:
      - bot_data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: .env
    command: python -m admin_web.main
    ports:
      - "8080:8080"
    volumes:
      - bot_data:/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  bot_data:
  redis_data:
