[project]
name = "podslyshano-bots"
version = "2.0.0"
description = "Telegram bots for Подслушано with admin web panel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/proposal_bot", "src/chat_bot", "src/admin_web"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "config.yaml"
"src/admin_web/templates" = "admin_web/templates"

[tool.hatch.build.targets.sdist]
include = ["src", "config.yaml", "scripts", "deploy", "README.md"]
