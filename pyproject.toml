[project]
name = "podslyshano-bots"
version = "1.0.0"
description = "Telegram bots for Подслушано: proposal bot and random chat bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/proposal_bot", "src/chat_bot"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "config.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "config.yaml", "scripts", "README.md"]
